const _am=applyM;applyM=function(k){_am(k);if(isA()){document.querySelector(".md .r2").insertAdjacentHTML("beforebegin",`<label>For employee<select id="fe" onchange="prev()">${EMP.filter(e=>e.on).map(e=>`<option value="${e.id}" ${e.id==cur?"selected":""}>${e.n} (${e.code||'EMP'+P(e.id)})</option>`).join("")}</select></label><div class="pv">Choosing someone else records it as approved straight away.</div>`);prev()}};
function clashes(){const out=[];for(let i=0;i<28;i++){const d=add(DAY,i);if(isW(d)||hol(d))continue;const of=k=>[...new Set(REQ.filter(r=>r.kind==k&&ACT.includes(r.status)&&r.start<=d&&r.end>=d&&E(r.emp)&&E(r.emp).on).map(r=>r.emp))];
const L=of("leave"),W=of("wfh");if(L.length>POL.off)out.push({d,k:"leave",n:L.length,lim:POL.off,names:L.map(x=>E(x).n)});if(W.length>POL.max)out.push({d,k:"WFH",n:W.length,lim:POL.max,names:W.map(x=>E(x).n)})}return out}
function clashCard(){const c=clashes();return`<div class="card" style="margin-bottom:14px;border-color:${c.length?"var(--bad)":"var(--line)"}"><h2>${c.length?"⚠ Clash alerts, next 4 weeks (pending included)":"No clashes in the next 4 weeks"}</h2>${c.slice(0,6).map(x=>`<div class="row"><div class="ic" style="--c:var(--bad)">${ICONS.warn}</div><div><b>${fs(x.d,{weekday:"short",day:"numeric",month:"short"})}</b>: ${x.n} on ${x.k} (limit ${x.lim})<br><small>${x.names.join(", ")}</small></div></div>`).join("")||`<small>Team limits: ${POL.off} on leave and ${POL.max} working from home per day. Change them in Admin.</small>`}</div>`}
function weekStrip(){const days=[];for(let i=0;days.length<7&&i<20;i++){const d=add(DAY,i);if(!isW(d))days.push(d)}const tot=EMP.filter(e=>e.on).length;
return`<div class="card" style="margin-bottom:14px"><h2>Week ahead</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px">${days.map(d=>{const h=hol(d),l=onDay("leave",d).length,w=onDay("wfh",d).length,bad=l>POL.off||w>POL.max;return`<div style="background:var(--soft);border-radius:10px;padding:10px;border:1px solid ${bad?"var(--bad)":"transparent"}"><small>${fs(d,{weekday:"short",day:"numeric"})}</small>${h?`<div style="color:var(--hl);font-weight:700">${h.n}</div>`:`<div style="font-size:22px;font-weight:800">${Math.max(0,tot-l-w)}</div><small>in office</small><br><small style="color:var(--lv)">${l} leave</small> <small style="color:var(--wf)">${w} WFH</small>`}</div>`}).join("")}</div></div>`}
function typesCard(){return`<div class="card sc" style="margin-bottom:14px"><h2>Leave types and default yearly days</h2><table><tr><th>Name</th><th>Days per year</th><th>Track balance</th><th></th></tr>${TYPES.map(t=>`<tr><td><input id="tn_${t[0]}" value="${t[1]}"></td><td><input id="tq_${t[0]}" type="number" min="0" step="0.5" value="${t[2]}"></td><td><input type="checkbox" id="tt_${t[0]}" ${t[3]?"checked":""} style="width:auto"></td><td><button class="btn g sm" onclick="saveType('${t[0]}')">Save</button></td></tr>`).join("")}<tr><td><input id="nt_n" placeholder="New type, e.g. Paternity"></td><td><input id="nt_q" type="number" min="0" step="0.5" value="5"></td><td></td><td><button class="btn sm" onclick="addType()">Add type</button></td></tr></table><small>Set a different number for one person under Edit on their row.</small></div>`}
const saveType=c=>{
  const n=(document.getElementById("tn_"+c).value||"").trim();
  const q=+document.getElementById("tq_"+c).value;
  if(!n){toast("Please enter a name for the leave type");return}
  if(isNaN(q)||q<0||q>365){toast("Quota must be between 0 and 365");return}
  act(`/leave-types/${c}`,{name:n,quota:q,tracked:document.getElementById("tt_"+c).checked},"PUT","Leave type saved");
};
const addType=()=>{
  const n=(document.getElementById("nt_n").value||"").trim();
  const q=+document.getElementById("nt_q").value;
  if(!n){toast("Please enter a name for the leave type");return}
  if(isNaN(q)||q<0||q>365){toast("Days per year must be between 0 and 365");return}
  act("/leave-types",{name:n,quota:q,tracked:true},"POST","Leave type added");
};
const delH=d=>act("/holidays/"+d,{},"DELETE","Holiday removed");
function editM(id){const e=E(id);openM(`<h3>Edit ${esc(e.n)}</h3><label>Full name<input id="ee_n"></label><label>Email<input id="ee_e" type="email"></label><label>Employee ID<input id="ee_c" placeholder="e.g. EMP001"></label><label>Job title<input id="ee_t"></label><label>Role<select id="ee_r"><option value="admin">Admin (Full Access)</option><option value="employee">Employee (Standard)</option></select></label><label>New password (optional)<input id="ee_p" type="password" placeholder="Leave blank to keep existing password"></label><h2>Yearly leave days for this person</h2><div class="r2">${PT().filter(t=>t!='CO').map(t=>`<label>${esc(TN[t])}<input type="number" step="0.5" min="0" id="eq_${t}" value="${Q[id+t]??""}" placeholder="${(TYPES.find(x=>x[0]==t)||[0,0,0])[2]} (default)"></label>`).join("")}</div><div class="acts"><button class="btn g" onclick="closeM()">Close</button><button class="btn" onclick="saveEmp(${id})">Save changes</button></div>`);document.getElementById("ee_n").value=dc(e.n);document.getElementById("ee_e").value=dc(e.email||"");document.getElementById("ee_c").value=dc(e.code||"");document.getElementById("ee_t").value=dc(e.t||"");document.getElementById("ee_r").value=e.role;}
function saveEmp(id){
  const n=(document.getElementById("ee_n").value||"").trim(),
        e=(document.getElementById("ee_e").value||"").trim(),
        c=(document.getElementById("ee_c").value||"").trim(),
        t=(document.getElementById("ee_t").value||"").trim(),
        r=document.getElementById("ee_r").value,
        p=(document.getElementById("ee_p").value||"").trim()||null;
  if(!n){toast("Please enter full name");return;}
  if(!e){toast("Please enter email address");return;}
  if(!emailRegex.test(e)){toast("Please enter a valid email address");return;}
  if(p&&p.length<6){toast("New password must be at least 6 characters");return;}
  const quotas={};
  PT().filter(t=>t!='CO').forEach(t=>{
    const v=document.getElementById("eq_"+t).value;
    quotas[t]=v===""?null:+v;
  });
  act(`/employees/${id}`,{name:n,email:e,emp_code:c,title:t,role:r,quotas,password:p},"PUT","Saved");
}
const dc=v=>String(v??"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const cq=v=>{v=dc(v);if(/^[=+\-@\t\r%]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
function csv(name,rows){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(cq).join(",")).join("\n")],{type:"text/csv"}));a.download=name;a.click()}
function reqRows(){return[["Employee","Type","From","To","Day part","Days","Status","Reason","Decided by"],...REQ.map(r=>[E(r.emp).n,r.kind=="wfh"?"WFH":TN[r.type],r.start,r.end,r.part,r.days,r.status,r.reason,r.by?E(r.by).n:""])]}
function repv(){const yr=DAY.slice(0,4),mo=DAY.slice(0,7),head=["Employee",...PT().map(t=>TN[t]+" used"),"Leave left","WFH this month","WFH this year","Pending"];
const data=EMP.filter(e=>e.on).map(e=>[e.n,...PT().map(t=>used(e.id,t)),availAll(e.id),wfhUsed(e.id,mo),REQ.filter(r=>r.emp==e.id&&r.kind=="wfh"&&HELD.includes(r.status)&&r.start.startsWith(yr)).reduce((a,r)=>a+r.days,0),REQ.filter(r=>r.emp==e.id&&r.status=="pending").length]);window._rep=[head,...data];
return`<div class="top"><div><h1>Reports</h1><p>Leave and WFH summary for ${yr}.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" onclick="csv('summary-${yr}.csv',window._rep)">Export summary</button><button class="btn" onclick="csv('all-requests.csv',reqRows())">Export all requests</button></div></div><div class="card sc"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${data.map(r=>`<tr>${r.map((x,i)=>`<td>${i?x:`<b>${x}</b>`}</td>`).join("")}</tr>`).join("")}</table></div>`}
load();
setInterval(()=>{const loginActive=document.getElementById("lg")&&document.getElementById("lg").classList.contains("on");if(!document.hidden&&!loginActive){load(true);}},12000);
window.addEventListener("focus",()=>{const loginActive=document.getElementById("lg")&&document.getElementById("lg").classList.contains("on");if(!loginActive){load(true);}});
document.addEventListener("visibilitychange",()=>{const loginActive=document.getElementById("lg")&&document.getElementById("lg").classList.contains("on");if(!document.hidden&&!loginActive){load(true);}});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(_pendingSyncRedraw&&!isUserBusy()){_pendingSyncRedraw=false;draw();}},300);});
</script>
</body></html>
