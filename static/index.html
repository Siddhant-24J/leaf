<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Leaf – Leave & WFH</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eceff4;--card:#fff;--ink:#101828;--mut:#667085;--line:#e3e7ee;--pri:#0b6e6e;--pri2:#0f3d3e;--lv:#6d5bd0;--wf:#1e9bd7;--hl:#e8a317;--ok:#13875a;--bad:#d92d3a;--soft:#f5f7fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1117;--card:#141c25;--ink:#eaf0f6;--mut:#8b98a8;--line:#243040;--soft:#1a2430;--pri:#2cb5b0;--pri2:#0f3d3e}}
:root[data-theme="dark"]{--bg:#0b1117;--card:#141c25;--ink:#eaf0f6;--mut:#8b98a8;--line:#243040;--soft:#1a2430;--pri:#2cb5b0;--pri2:#0f3d3e}

body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Manrope,system-ui,sans-serif;display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--pri2);color:#e6f3f2;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;padding:0 10px 18px;color:#fff}.logo i{font-style:normal;color:#7ee0d6}
aside button.nv{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;font-weight:600;color:#b9d8d6}
aside button.nv:hover{background:#ffffff14}aside button.nv.on{background:#fff;color:var(--pri2)}
.who{margin-top:auto;font-size:12px;color:#9cc3c0}.who select{width:100%;margin-top:6px;background:#ffffff1a;color:#fff;border:1px solid #ffffff30;border-radius:8px;padding:8px}.who option{color:#000}
main{padding:26px 30px 50px;max-width:1180px;width:100%}
h1{font-size:26px;letter-spacing:-.6px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{margin:0 0 12px;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.top p{margin:2px 0 0;color:var(--mut)}
.btn{all:unset;cursor:pointer;background:var(--pri);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px}.btn:focus-visible,button:focus-visible{outline:2px solid var(--lv);outline-offset:2px}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.no{background:var(--bad)}.btn.sm{padding:6px 11px;font-size:12px}.btn[disabled]{opacity:.4;cursor:not-allowed}
.hero{background:linear-gradient(120deg,var(--pri2),#145c5c 60%,#2a7d6f);color:#fff;border-radius:18px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hero b{font-size:38px;font-weight:800;letter-spacing:-1.5px;display:block;line-height:1.1}.hero span{color:#bfe3df}.hero .btn{background:#fff;color:var(--pri2)}.hero .btn.g{background:#ffffff1f;color:#fff;border:1px solid #ffffff40}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.st,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.st{display:flex;gap:12px;align-items:center}
.st small{color:var(--mut);display:block}.st b{font-size:24px;letter-spacing:-.5px}.ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}.col{display:flex;flex-direction:column;gap:14px}
.ring{--p:50;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}.ring span{background:var(--card);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--pri));border-radius:6px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row>div:nth-child(2){flex:1;min-width:0}.row small{color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.bd{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:12.5px}.tabs button.on{background:var(--ink);color:var(--bg)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px}td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}.sc{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:660px}
.cal>div{background:var(--card);min-height:96px;padding:6px}.cal .h{min-height:0;text-align:center;color:var(--mut);font-weight:700;font-size:12px;background:var(--soft)}.cal .we{background:var(--soft)}.cal .dn{font-weight:700;font-size:12px;color:var(--mut)}.cal .td .dn{color:#fff;background:var(--pri);border-radius:6px;padding:0 6px;display:inline-block}
.ch{display:block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;margin-top:3px;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch.p{background:transparent;color:var(--c);border:1px dashed var(--c)}.ch.h{background:var(--hl);color:#2b1d00}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);align-items:center}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;background:var(--c)}
#m{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:50;padding:16px}#m.on{display:grid}.md{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
label{display:block;font-weight:600;font-size:12.5px;margin-bottom:10px}input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{all:unset;flex:1;text-align:center;padding:8px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-weight:700}.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pv{background:var(--soft);border-radius:9px;padding:10px;font-size:12.5px;margin-bottom:10px;color:var(--mut)}
#t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:60;max-width:90vw}
@media(max-width:860px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.logo{padding:0 10px 0 4px}.who{margin:0 0 0 auto}main{padding:18px 14px 40px}.cols{grid-template-columns:1fr}}
#lg{position:fixed;inset:0;z-index:40;background:linear-gradient(120deg,var(--pri2),#145c5c 60%,#2a7d6f);display:none;place-items:center;padding:16px;overflow:auto}#lg.on{display:grid}.lc{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:380px}.lc p{color:var(--mut);margin:4px 0 16px}.or{display:flex;align-items:center;gap:10px;color:var(--mut);margin:14px 0;font-size:12px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}.er{color:var(--bad);font-size:12.5px;min-height:18px;margin:4px 0}
</style></head><body>
<aside><div class="logo">leaf<i>.</i></div><div id="nav" style="display:contents"></div><div class="who" id="who"></div></aside>
<div id="lg"><div class="lc"><div class="logo" style="padding:0 0 14px;color:var(--ink)">leaf<i style="color:var(--pri)">.</i></div><h1>Sign in</h1><p>Sign in with your Google account or email.</p><div id="gbtn" style="min-height:44px"></div><div class="er" id="gmsg"></div><div class="or">Or sign in with email</div><label>Email<input id="ae" type="email" autocomplete="username"></label><label>Password<input id="ap" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()"></label><div class="er" id="amsg"></div><button class="btn" style="display:block;text-align:center;width:100%" onclick="adminLogin()">Sign in</button></div></div><main id="app"></main><div id="m"></div><div id="t"></div>
<script>
const P=n=>String(n).padStart(2,"0"),F=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate()),D=s=>new Date(s+"T00:00:00");
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return F(d)},isW=s=>[0,6].includes(D(s).getDay()),nw=s=>{while(isW(s))s=add(s,1);return s};
const REAL=F(new Date()),DAY=nw(REAL),fs=(s,o)=>D(s).toLocaleDateString("en-IN",o||{day:"numeric",month:"short"});
const DL=DAY===REAL?"today":fs(DAY);
let HOL=[];
const hol=s=>HOL.find(h=>h.d===s);
const wd=(s,e,p)=>{if(e<s)return 0;let n=0;for(let x=s;x<=e;x=add(x,1))if(!isW(x)&&!hol(x))n++;return s===e&&p!=="full"?n/2:n};
const COL=["#6d5bd0","#1e9bd7","#e0623b","#13875a","#c2418f","#8a6d1d","#4b6bd6"];
const EMP=[];
const TYPES=[["CL","Casual",12],["SL","Sick",8],["AL","Annual",10],["UL","Unpaid",0]],TN=Object.fromEntries(TYPES.map(t=>[t[0],t[1]]));
let ADJ={},REQ=[],AUD=[],POL={q:4,max:3},nid=1,cur=1,view="dash",calM=DAY.slice(0,7),flt="all";
const E=id=>EMP.find(e=>e.id==id)||{id:id||0,n:"Employee #"+(id||"?"),role:"employee",t:"",on:0,c:"#667085",email:""},ACT=["pending","approved","cancellation_requested"],HELD=["approved","cancellation_requested"];
const used=(e,t)=>REQ.filter(r=>r.emp==e&&r.kind=="leave"&&r.type==t&&HELD.includes(r.status)&&r.start.slice(0,4)==DAY.slice(0,4)).reduce((a,r)=>a+r.days,0);
const avail=(e,t)=>qt(e,t)+(ADJ[e+t]||0)-used(e,t);
const availAll=e=>PT().reduce((a,t)=>a+avail(e,t),0),quotaAll=e=>PT().reduce((a,t)=>a+qt(e,t)+(ADJ[e+t]||0),0);
const wfhUsed=(e,m)=>REQ.filter(r=>r.emp==e&&r.kind=="wfh"&&HELD.includes(r.status)&&r.start.slice(0,7)==m).reduce((a,r)=>a+r.days,0);
const log=(a)=>AUD.unshift({t:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),who:E(cur).n,a});




const initials=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]||"").join("").toUpperCase().slice(0,2)||"?";
const av=e=>{const emp=E(e);return`<div class="av" style="background:${emp.c||'#667085'}">${initials(emp.n)}</div>`};
const SB={pending:["Pending","var(--hl)"],approved:["Approved","var(--ok)"],rejected:["Rejected","var(--bad)"],cancelled:["Cancelled","var(--mut)"],cancellation_requested:["Cancel requested","var(--lv)"]};
const bd=(t,c)=>`<span class="bd" style="--c:${c}">${t}</span>`,sb=s=>bd(...SB[s]);
const kb=r=>r.kind=="wfh"?bd("Work from home","var(--wf)"):bd(TN[r.type]+" leave","var(--lv)");
const rng=r=>r.start==r.end?fs(r.start,{weekday:"short",day:"numeric",month:"short"})+(r.part!="full"?" · "+(r.part=="first"?"first half":"second half"):""):fs(r.start)+" – "+fs(r.end);
const toast=m=>{const t=document.getElementById("t");t.textContent=m;t.style.display="block";clearTimeout(t._);t._=setTimeout(()=>t.style.display="none",2800)};
const openM=h=>{const m=document.getElementById("m");m.innerHTML=`<div class="md">${h}</div>`;m.classList.add("on")},closeM=()=>document.getElementById("m").classList.remove("on");
const isA=()=>E(cur).role=="admin",pend=()=>REQ.filter(r=>r.status=="pending"||r.status=="cancellation_requested");
const overlapN=r=>new Set(REQ.filter(x=>x.id!=r.id&&x.emp!=r.emp&&x.kind=="leave"&&ACT.includes(x.status)&&x.start<=r.end&&x.end>=r.start).map(x=>x.emp)).size;
const onDay=(k,d)=>REQ.filter(r=>r.kind==k&&HELD.includes(r.status)&&r.start<=d&&r.end>=d&&E(r.emp).on);

function go(v){view=v;draw()}
function stat(ic,c,l,v){return`<div class="st"><div class="ic" style="--c:${c}">${ic}</div><div><small>${l}</small><b>${v}</b></div></div>`}
function reqRow(r,adm){const me=r.emp==cur,can=adm&&!me,ov=overlapN(r),oq=r.over&&r.status=="pending";
let a="";if(adm&&(r.status=="pending"||r.status=="cancellation_requested")){const cr=r.status=="cancellation_requested";a=`<button class="btn ok sm" ${me?'disabled title="You can’t decide your own request"':""} onclick="dec(${r.id},'ok')">${cr?"Approve cancel":"Approve"}</button> <button class="btn no sm" ${me?"disabled":""} onclick="${cr?`dec(${r.id},'keep')`:`rejM(${r.id})`}">${cr?"Keep leave":"Reject"}</button>`}
else if(me&&(r.status=="pending"||(r.status=="approved"&&r.end>=DAY)))a=`<button class="btn g sm" onclick="cancel(${r.id})">${r.status=="pending"?"Cancel":"Request cancellation"}</button>`;
if(adm&&!me&&r.status=="approved")a=`<button class="btn g sm" onclick="dec(${r.id},'revoke')">Revoke</button>`;
return`<div class="row">${av(r.emp)}<div><b>${E(r.emp).n}</b> ${kb(r)} ${sb(r.status)}${oq?" "+bd("Over quota","var(--bad)"):""}<br><small>${rng(r)} · ${r.days} day${r.days==1?"":"s"} · ${r.reason||"No reason given"}${ov&&r.kind=="leave"&&r.status=="pending"?` · ⚠ ${ov} teammate${ov>1?"s":""} also off`:""}${r.by&&r.status!="pending"?` · by ${E(r.by).n}`:""}${r.note?` · “${r.note}”`:""}</small></div><div>${a}</div></div>`}
function dash(){const adm=isA(),u=E(cur),h=HOL.find(x=>x.d>=REAL)||{n:"None",d:REAL},mo=DAY.slice(0,7);
if(!adm){const mine=REQ.filter(r=>r.emp==cur),y=mine.filter(r=>r.kind=="leave"&&HELD.includes(r.status)&&r.start.slice(0,4)==DAY.slice(0,4)).reduce((a,r)=>a+r.days,0),w=wfhUsed(cur,mo),av=availAll(cur),q=quotaAll(cur);
return`<div class="hero"><div><span>Welcome back, ${u.n.split(" ")[0]}</span><b>${av} days of leave left</b><span>${u.t} · ${y} used this year</span></div><div style="display:flex;gap:8px"><button class="btn" onclick="applyM('leave')">Apply for leave</button><button class="btn g" onclick="applyM('wfh')">Request WFH</button></div></div>
<div class="grid">${stat("🌴","var(--lv)","Available leave",av+" days")}${stat("⏳","var(--hl)","Pending requests",mine.filter(r=>r.status=="pending").length)}${stat("✅","var(--ok)","Used this year",y+" days")}${stat("🎆","var(--hl)","Next holiday",h.n+"<small style='display:block;font-size:12px;font-weight:600'>"+fs(h.d,{weekday:"short",day:"numeric",month:"short"})+"</small>")}${stat("🏠","var(--wf)","WFH this month",w+" / "+POL.q)}</div>
<div class="cols"><div class="card"><h2>My requests</h2>${mine.slice().reverse().slice(0,6).map(r=>reqRow(r,false)).join("")||"<small>No requests yet. Apply for leave or WFH to get started.</small>"}</div>
<div class="col"><div class="card"><h2>Leave balance</h2><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="ring" style="--p:${q?av/q*100:0}"><span>${av}</span></div><small>of ${q} paid days<br>remaining</small></div>${PT().map(t=>{const tq=qt(cur,t)+(ADJ[cur+t]||0);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${TN[t]}</b><small>${avail(cur,t)} of ${tq}</small></div><div class="bar"><i style="width:${tq?avail(cur,t)/tq*100:0}%"></i></div></div>`}).join("")}</div>
<div class="card"><h2>WFH this month</h2><div class="bar" style="--c:var(--wf)"><i style="width:${Math.min(100,w/POL.q*100)}%"></i></div><small>${w} of ${POL.q} days used. Extra days need admin approval.</small></div></div></div>`}
const pn=pend(),ap=REQ.filter(r=>r.status=="approved"&&r.start.slice(0,7)==mo).length,ol=onDay("leave",DAY),wf=onDay("wfh",DAY);
const who=(a,t)=>a.length?a.map(r=>`<div class="row">${av(r.emp)}<div><b>${E(r.emp).n}</b><br><small>${t=="l"?TN[r.type]+" · until "+fs(r.end):"Remote · "+E(r.emp).t}</small></div></div>`).join(""):"<small>Nobody.</small>";
return`<div class="hero"><div><span>${fs(DAY,{weekday:"long",day:"numeric",month:"long"})}</span><b>${pn.length} request${pn.length==1?"":"s"} need your decision</b><span>${ol.length} out on leave · ${wf.length} working remotely</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go('req')">Review requests</button><button class="btn g" onclick="go('admin')">Add holiday</button><button class="btn g" onclick="applyM('leave')">My leave</button></div></div>
<div class="grid">${stat("👥","var(--pri)","Total employees",EMP.filter(e=>e.on).length)}${stat("⏳","var(--hl)","Pending approvals",pn.length)}${stat("🌴","var(--lv)","On leave "+DL,ol.length)}${stat("🏠","var(--wf)","Working from home "+DL,wf.length)}${stat("🏢","var(--ok)","In office "+DL,Math.max(0,EMP.filter(e=>e.on).length-ol.length-wf.length))}${stat("✅","var(--ok)","Approved this month",ap)}</div>
${weekStrip()}${clashCard()}<div class="cols"><div class="card"><h2>Pending approvals</h2>${pn.map(r=>reqRow(r,true)).join("")||"<small>All caught up. Nothing is waiting for approval.</small>"}</div>
<div class="col"><div class="card"><h2>Out on leave ${DL}</h2>${who(ol,"l")}</div><div class="card"><h2>Working from home ${DL}</h2>${who(wf,"w")}</div><div class="card"><h2>Upcoming holidays</h2>${HOL.filter(x=>x.d>=REAL).slice(0,3).map(x=>`<div class="row"><div class="ic" style="--c:var(--hl)">🎆</div><div><b>${x.n}</b><br><small>${fs(x.d,{weekday:"long",day:"numeric",month:"short"})}</small></div></div>`).join("")}</div></div></div>`}
function reqs(){const adm=isA();let l=REQ.filter(r=>adm||r.emp==cur).slice().reverse();
const F2={all:()=>1,leave:r=>r.kind=="leave",wfh:r=>r.kind=="wfh",pending:r=>r.status=="pending"||r.status=="cancellation_requested",approved:r=>r.status=="approved",rejected:r=>r.status=="rejected"||r.status=="cancelled"};
l=l.filter(F2[flt]);if(+efl)l=l.filter(r=>r.emp==efl);return`<div class="top"><div><h1>${adm?"All requests":"My requests"}</h1><p>${adm?"Approve, reject and review leave and WFH. You can’t decide your own.":"Track leave and work-from-home requests."}</p></div><button class="btn" onclick="applyM('leave')">New request</button></div>
<div class="tabs">${[["all","All"],["leave","Leave"],["wfh","WFH"],["pending","Pending"],["approved","Approved"],["rejected","Rejected & cancelled"]].map(t=>`<button class="${flt==t[0]?"on":""}" onclick="flt='${t[0]}';draw()">${t[1]}</button>`).join("")}</div>
${adm?`<select style="width:auto;margin:0 0 12px" onchange="efl=this.value;draw()"><option value="0">All employees</option>${EMP.map(e=>`<option value="${e.id}" ${e.id==efl?"selected":""}>${e.n}</option>`).join("")}</select>`:""}<div class="card">${l.map(r=>reqRow(r,adm)).join("")||"<small>No requests match this filter.</small>"}</div>`}
function calv(){const adm=isA(),[y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,dim=new Date(y,m,0).getDate();let c=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="h">${d}</div>`).join("");
for(let i=0;i<off;i++)c+="<div class='we'></div>";
for(let d=1;d<=dim;d++){const s=y+"-"+P(m)+"-"+P(d),ev=REQ.filter(r=>(adm||r.emp==cur)&&ACT.includes(r.status)&&r.start<=s&&r.end>=s&&E(r.emp).on),h=hol(s);
c+=`<div class="${isW(s)?"we":""} ${s==REAL?"td":""}"><span class="dn">${d}</span>${h?`<span class="ch h">${h.n}</span>`:""}${ev.slice(0,3).map(r=>`<span class="ch ${r.status=="pending"?"p":""}" style="--c:${r.kind=="wfh"?"var(--wf)":"var(--lv)"}">${E(r.emp).n.split(" ")[0]}${r.part!="full"?" ½":""}</span>`).join("")}${ev.length>3?`<small>+${ev.length-3} more</small>`:""}</div>`}

</script><script>
const api=async(p,o={})=>{const r=await fetch("/api"+p,{method:o.method||"GET",headers:{"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined});if(r.status==401)throw 401;const j=await r.json().catch(()=>({}));if(!r.ok)throw(typeof j.detail=="string"?j.detail:"Please check the details and try again");return j};

async function adminLogin(){amsg.textContent="";try{await api("/auth/login",{method:"POST",body:{email:ae.value,password:ap.value}});ap.value="";await load()}catch(e){amsg.textContent=e===401?"Sign-in failed":e}}

let Q={},efl=0;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sx=o=>typeof o=="string"?esc(o):Array.isArray(o)?o.map(sx):o&&typeof o=="object"?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,sx(v)])):o;

async function dec(id,a,force){try{await api(`/requests/${id}/decide`,{method:"POST",body:{action:a=="ok"?"approve":a=="revoke"?"revoke":"keep",force:!!force}});toast(a=="revoke"?"Approval revoked":"Saved");closeM();await load()}catch(e){if(typeof e=="string"&&e.startsWith("clash:"))openM(`<h3>Team clash</h3><p>${esc(e.slice(6))}</p><div class="acts"><button class="btn g" onclick="closeM()">Go back</button><button class="btn no" onclick="dec(${id},'ok',true)">Approve anyway</button></div>`);else if(e===401)showLogin(true);else toast(e)}}
const _am=applyM;applyM=function(k){_am(k);if(isA()){document.querySelector(".md .r2").insertAdjacentHTML("beforebegin",`<label>For employee<select id="fe" onchange="prev()">${EMP.filter(e=>e.on).map(e=>`<option value="${e.id}" ${e.id==cur?"selected":""}>${e.n}</option>`).join("")}</select></label><div class="pv">Choosing someone else records it as approved straight away.</div>`);prev()}};
function clashes(){const out=[];for(let i=0;i<28;i++){const d=add(DAY,i);if(isW(d)||hol(d))continue;const of=k=>[...new Set(REQ.filter(r=>r.kind==k&&ACT.includes(r.status)&&r.start<=d&&r.end>=d&&E(r.emp)&&E(r.emp).on).map(r=>r.emp))];
const L=of("leave"),W=of("wfh");if(L.length>POL.off)out.push({d,k:"leave",n:L.length,lim:POL.off,names:L.map(x=>E(x).n)});if(W.length>POL.max)out.push({d,k:"WFH",n:W.length,lim:POL.max,names:W.map(x=>E(x).n)})}return out}

function repv(){const yr=DAY.slice(0,4),mo=DAY.slice(0,7),head=["Employee",...PT().map(t=>TN[t]+" used"),"Leave left","WFH this month","WFH this year","Pending"];
