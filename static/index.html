async function submitOvertimeClaim(){
  const d=document.getElementById("ot_d").value;
  const h=+document.getElementById("ot_h").value;
  const desc=(document.getElementById("ot_desc").value||"").trim();
  if(!d){toast("Please pick a date");return}

  if(!desc||desc.length<3){toast("Please explain the work done");return}
  await act("/overtime",{date:d,hours:h,work_description:desc},"POST","Overtime claim submitted for admin approval!");
}
